<h2>Set New Password</h2>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input
        type="password"
        name="password"
        placeholder="New Password"
        required
    >

    <input
        type="password"
        name="confirm"
        placeholder="Confirm Password"
        required
    >

    <button type="submit">
        Update Password
    </button>

</form>
